<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon"
        href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔧</text></svg>'>
    <title>404 Not Found</title>
    <style>
        :root {
            --padding: 20px;
            --knob-size: 200px;
            --transition-duration: 0.3s;
        }

        * {
            user-select: none;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            /* 垂直布局 */
            min-height: 100vh;
            /* 页面至少占满一屏 */
            margin: 0;
            /* justify-content: center;
            align-items: center; */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            background: #23232e;
            color: #fff;
        }

        .container {
            flex: 1;
            /* 内容区占满剩余空间 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* 保持内容居中 */
            gap: 20px;
            /* height: fit-content; */
            padding: 40px;
            /* margin: auto; */
            text-align: center;
        }

        .container h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
            font-weight: 700;
        }

        .container p {
            margin: 0 0 10px 0;
            opacity: .8;
        }

        footer {
            text-align: center;
            padding: 12px;
            /* font-size: 12px; */
            font-size: clamp(8px, 2vw, 12px);
        }

        .typing-demo {
            display: inline-block;
            overflow: hidden;
            /* 隐藏未显示的文字 */
            white-space: nowrap;
            /* 不换行 */
            border-right: 3px solid;
            /* 光标效果 */
            /* font-size: 32px; */
            font-size: clamp(20px, 5vw, 32px);
            font-weight: 700;
            line-height: 1.2;
            min-height: 1.2em;
            /* 预留至少一行的高度（32px）*/
            margin-bottom: 10px;
            /* 保持和原 h1 一样的下边距 */
            animation: caret-blink .6s step-end infinite;
        }

        /* 光标闪烁 */
        @keyframes caret-blink {
            50% {
                border-color: transparent;
            }
        }

        .typing-demo {
            animation: caret-blink .6s step-end infinite;
        }

        .typing-demo .error-code {
            color: #ffa600d6;
            /* 只让 404 橙色 */
        }

        /* ----- Stretch effect 开关 ----- */
        #stretch-effect-checkbox {
            font-size: 14px;
            text-align: center;
            cursor: pointer;
        }

        #stretch-effect-checkbox .info {
            font-size: 12px;
            opacity: 0;
            margin-top: 16px;
            transition: opacity .2s ease;
        }

        #stretch-effect-checkbox input[type="checkbox"] {
            margin: 0;
            vertical-align: middle;
        }

        #stretch-effect-checkbox input[type="checkbox"]:checked+.info {
            opacity: 0.5;
        }

        /* ----- 主体切换控件 ----- */
        #smudge-toggle {
            transform: scale(0.8);
        }

        #smudge-toggle input[type="checkbox"] {
            display: none;
        }

        #smudge-toggle input[type="checkbox"]:checked+label {
            background-color: #110f13;
        }

        #smudge-toggle input[type="checkbox"]:checked+label>span {
            left: calc(100% - var(--knob-size) - var(--padding));
            background-position: -220px -15px;
        }

        /* 开启“Stretch effect”后的细节 */
        #smudge-toggle.stretch-effect input[type="checkbox"]:checked+label {
            background-color: #110f13;
        }

        #smudge-toggle.stretch-effect input[type="checkbox"]:checked+label>span {
            left: calc(100% - var(--knob-size) - var(--padding));
        }

        #smudge-toggle.stretch-effect input[type="checkbox"]:active+label>span {
            width: calc(100% - (var(--padding) * 2));
            background-position: 0px -15px;
        }

        #smudge-toggle.stretch-effect input[type="checkbox"]:checked:active+label>span {
            margin-left: calc((100% - (var(--padding) * 2) - var(--knob-size)) * -1);
            background-position: 0px -15px;
        }

        #smudge-toggle label {
            display: flex;
            gap: 40px;
            align-items: center;
            position: relative;
            top: 0;
            width: 460px;
            height: calc((var(--padding) * 2) + var(--knob-size));
            padding: var(--padding) calc(var(--padding) * 2);
            margin: auto;
            background-color: #6b5338;
            border-radius: 99999px;
            cursor: pointer;
            box-sizing: border-box;
            box-shadow: 0px 20px 40px 0 #001b369e;
            transform: scale(1);
            transition:
                var(--transition-duration) ease top,
                var(--transition-duration) ease box-shadow,
                var(--transition-duration) ease transform,
                var(--transition-duration) ease background-color;
        }

        #smudge-toggle label:active {
            top: 3px;
            transform: scale(0.98);
            box-shadow: 0px 20px 40px -10px #001b369e;
        }

        #smudge-toggle label>span {
            position: absolute;
            top: var(--padding);
            left: var(--padding);
            width: var(--knob-size);
            height: var(--knob-size);
            margin-left: 0;
            box-sizing: border-box;
            border-radius: 300px;
            background-size: 420px;

        #smudge-toggle label div {
            color: #fff;
            /* font-size: 36px; */
            font-size: clamp(24px, 4vw, 36px);
            font-weight: bold;
            margin: 0 1px;
        }

        @media (max-width: 520px) {
            body {
                min-height: 100dvh; display: flex; flex-direction: column;
            }

            .container {
                flex: 1; display: flex; flex-direction: column; justify-content: center;
            }

            /* 适当减少中间区域的间距，避免挤出一屏高度 */
            .container {
                padding: 20px; gap: 12px;
            }

            /* 1) knob 自适应（保留你桌面 200px 的上限） */
            :root {
                --knob-size: clamp(140px, 36vw, 200px);
            }

            /* 2) 胶囊在手机上别太宽 */
            #smudge-toggle label {
                width: min(90vw, 460px);
            }

            /* 3) 背景图“按 knob 等比缩放”，且偏移也用等比数值 */
            #smudge-toggle label > span {
                background-size: calc(var(--knob-size) * 2.1);           /* 原 420px ≈ 2.1×200 */
                background-position: 0 calc(var(--knob-size) * -0.075);  /* 原 -15px ≈ -0.075×200 */
            }

            /* 4) 切到右侧时的水平偏移也按比例 */
            #smudge-toggle input[type="checkbox"]:checked + label > span {
                background-position:
                    calc(var(--knob-size) * -1.1)                          /* 原 -220px ≈ -1.1×200 */
                    calc(var(--knob-size) * -0.075);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="typing-demo" aria-label="typing"></div>
        <div id="smudge-toggle" class="stretch-effect">
            <input type="checkbox" id="checkbox">
            <label for="checkbox">
                <span></span>
                <div>Why Not Just Quit😭</div>
                <div>🫵 You Know It Is 404</div>
            </label>
        </div>
    </div>

    <footer>
        ༺ཌ༈ 🙏Thank
        <a href="https://codepen.io/singhimalaya/pen/JjjqEpj" target="_blank" rel="noopener noreferrer"
            style="color:#d87cff; text-decoration:none">
            Himalaya Singh
        </a>
        For This Wonderful Page! ད༻
    </footer>

    <script>
        (function () {
            const el = document.querySelector('.typing-demo');

            // 配置序列：先显示“404 - Page Not Found”，停5秒，再删，再显示“😑YOU SHOULD CLOSE THE TAB”
            const sequence = [
                { text: '404 - Page Not Found', holdMs: 8000, colorFirst3AsError: true },
                { text: '😑 YOU SHOULD CLOSE THE TAB', holdMs: 3000, colorFirst3AsError: false },
            ];

            const TYPE_INTERVAL = 55;   // 打字间隔（毫秒）
            const DELETE_INTERVAL = 35; // 删除间隔（毫秒）

            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            // ✅ 关键：按“码点”迭代，避免把 emoji 拆成两个 UTF-16 码元
            const toCodePoints = (s) => Array.from(s);

            // 按码点逐字打到 el；前3个字符可着色为 .error-code
            async function typeText(text, { colorFirst3AsError = false } = {}) {
                el.innerHTML = '';
                let i = 0;
                for (const ch of toCodePoints(text)) {
                    if (colorFirst3AsError && i < 3) {
                        let lastChild = el.lastChild;
                        if (
                            !lastChild ||
                            lastChild.nodeType !== Node.ELEMENT_NODE ||
                            !lastChild.classList ||
                            !lastChild.classList.contains('error-code')
                        ) {
                            const span = document.createElement('span');
                            span.className = 'error-code';
                            el.appendChild(span);
                            lastChild = span;
                        }
                        lastChild.textContent += ch;
                    } else {
                        el.append(ch);
                    }
                    i++;
                    await sleep(TYPE_INTERVAL);
                }
            }

            // 按码点逐个回删（同时兼容文本节点与元素节点）
            async function deleteAll() {
                while (el.lastChild) {
                    const last = el.lastChild;
                    if (last.nodeType === Node.TEXT_NODE || last.nodeType === Node.ELEMENT_NODE) {
                        const cps = toCodePoints(last.textContent);
                        cps.pop(); // 去掉最后一个“字符”（码点）
                        last.textContent = cps.join('');
                        if (!last.textContent.length) el.removeChild(last);
                    } else {
                        el.removeChild(last);
                    }
                    await sleep(DELETE_INTERVAL);
                }
            }

            (async function run() {
                // 第一句：打字 -> 停顿 -> 删除
                await typeText(sequence[0].text, { colorFirst3AsError: sequence[0].colorFirst3AsError });
                await sleep(sequence[0].holdMs);
                await deleteAll();

                // 第二句：再打字 -> 停顿（是否循环可按需添加）
                await typeText(sequence[1].text, { colorFirst3AsError: sequence[1].colorFirst3AsError });
                await sleep(sequence[1].holdMs);
                // 如果你想循环播放，取消下一行注释：
                // location.reload();  // 或者再次调用 run() 形成无限循环
            })();
        })();
    </script>

    <script>
        (function () {
            const HOLD_MS = 1500; // 长按判定时长
            const smudge = document.getElementById('smudge-toggle');
            const input = document.getElementById('checkbox');
            const label = smudge.querySelector('label');

            let holdTimer = null;
            let isHolding = false;
            let suppressClick = false;
            const originalFor = label.getAttribute('for'); // 记录原来的 for

            function beginHold() {
                // 根据当前是否在右侧，给容器标记方向（CSS 决定从哪边拉伸）
                smudge.classList.toggle('is-right', input.checked);
                smudge.classList.add('holding');
                isHolding = true;

                // 关键：移除 label 的 for 属性，避免“长按结束时”的合成 click 去切换 checkbox
                label.removeAttribute('for');

                // 同时标记要拦截后续一次 click
                suppressClick = true;
            }

            function endHold() {
                clearTimeout(holdTimer);
                holdTimer = null;

                if (isHolding) {
                    smudge.classList.remove('holding');
                    isHolding = false;

                    // 释放后立即恢复 for，但本次释放产生的 click 仍会被下面的 click 监听拦截
                    label.setAttribute('for', originalFor);
                }
            }

            // 统一 Pointer 事件（鼠标/触控）
            label.addEventListener('pointerdown', (e) => {
                e.preventDefault();               // 防文本选择/滚动
                holdTimer = setTimeout(beginHold, HOLD_MS);
            });

            ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => {
                label.addEventListener(type, (e) => {
                    // 若在 holding 期间结束，阻止这次释放导致的默认点击
                    if (isHolding) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    endHold();
                });
            });

            // 拦截“长按后的那一次 click”，保证不切换
            label.addEventListener('click', (e) => {
                if (suppressClick) {
                    e.preventDefault();
                    e.stopPropagation();
                    suppressClick = false; // 只拦这一击
                }
                // 非长按的短按，仍由 label 的 for=checkbox 触发正常切换
            }, true);
        })();
    </script>
</body>

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random GIF Background</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: transparent;
            /* 这里直接请求 /gif，让 Cloudflare 去做随机与回源 */
            background-image: url("/gif");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            /* 或者 contain，看你想要的效果 */
        }
    </style>
</head>

<body></body>

</html>
